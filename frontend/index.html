<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Assistant Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            background: #f4f4f4;
        }
        #chat-window {
            background: white;
            border-radius: 8px;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .message {
            margin: 8px 0;
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 75%;
            clear: both;
        }
        .user-message {
            background: #007bff;
            color: white;
            float: right;
        }
        .bot-message {
            background: #e5e5ea;
            color: black;
            float: left;
        }
        #input-area {
            display: flex;
            margin-top: 10px;
        }
        #user-input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        #send-button {
            padding: 10px 20px;
            margin-left: 8px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Student Assistant Chatbot</h2>
    <div id="chat-window"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your question..." autofocus>
        <button id="send-button">Send</button>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/chat";

        let conversationId = null;  // starts null; set after first response

        const chatWindow = document.getElementById("chat-window");
        const userInput = document.getElementById("user-input");
        const sendButton = document.getElementById("send-button");

        function addMessage(text, sender) {
            const div = document.createElement("div");
            div.className = "message " + (sender === "user" ? "user-message" : "bot-message");
            div.textContent = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;  // auto-scroll to latest
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, "user");
            userInput.value = "";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        conversation_id: conversationId,
                        message: message
                    })
                });

                if (!response.ok) {
                    addMessage("Sorry, something went wrong. Please try again.", "bot");
                    return;
                }

                const data = await response.json();
                conversationId = data.conversation_id;  // remember for next message
                addMessage(data.reply, "bot");

            } catch (error) {
                addMessage("Could not reach the server. Is the API running?", "bot");
            }
        }

        sendButton.addEventListener("click", sendMessage);
        userInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
